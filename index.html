<!-- calculator 
has => numbers 0 -> 9  Done
    => decimal .       Done
    => add, sub, multiplication, division +, -, x, % (or / )  Done
    => square root => sqrt()   Done
    => inverse sign +/-        Done
    => reset button CE         Done
    => equal sign =            Done
    => text box displaying input 

-->

<!DOCTYPE html>
<html>
    <head> 
        <title>
            calculator 
        </title>
        <!-- style sheet -->
        <link rel="stylesheet" href="style.css">
        <!-- script file -->
        <script src="script.js" defer></script>
    </head>
    <body>
        <div class="calc">
            <div class="display">
                <div id="input_function"></div>
                <div id="result">0</div>
            </div>
            <div class="buttons">
                <!-- after every 4th button add the fouth column { this are the +, -, /, *, =}-->
                <button class="empty_button" disabled></button>
                <button class="operator" data-action="sqrt">√</button>
                <button class="operator" data-action="clear">CE</button>
                <button class="operator" data-action="delete">⌫</button>

                <button value="9">9</button>
                <button value="8">8</button>
                <button value="7">7</button>
                <button class="operator" value="*">x</button>
                
                <button value="6">6</button>
                <button value="5">5</button>
                <button value="4">4</button>
                <button class="operator" value="/">÷</button>
                
                <button value="3">3</button>
                <button value="2">2</button>
                <button value="1">1</button>
                <button class="operator" value="+">+</button>
                
                <!--adding the bottom buttons-->
                <button class="operator" data-action="sign_swap">+/-</button>
                <button class="zero" value="0">0</button>
                <button value=".">.</button>
                <button class="equals" data-action="equals">=</button>
            </div>
        </div>
    </body>
</html>
